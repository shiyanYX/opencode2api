<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>opencode2api 面板 · 方向 B「诊断流」高保真原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1f1f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f2705f'/%3E%3C/svg%3E">
<!--
  ============================================================================
  U2 方向 B · 诊断流（Triage Flow）· 高保真原型
  ----------------------------------------------------------------------------
  核心主张：以「问题」为中心，而不是以「页面」为中心。平时极简，异常时自动展开。
  本文件是三个方向初稿中的 B 版（A/C 由另外两路负责，三方向的选择权在用户）。
  自包含：无 CDN、无构建、无外部字体，file:// 双击即可打开。
  ============================================================================
-->
<style>
/* ==========================================================================
   0. 设计令牌
   ----------------------------------------------------------------------
   直接采用 U1 研究报告 §2.1 的结论：中性色是**纯无彩度灰阶**（chroma=0），
   主色让位给状态语义色；不引入品牌蓝，不做渐变。
   圆角刻意不用 freellm 的 24px：诊断流信息密度更高，16px 更"临床"、不轻浮。
   阴影只留一处（sticky 顶栏），分层靠 border + 背景色阶（U1 §2.4）。
   ========================================================================== */
:root{
  --bg:#0f0f0f; --surf:#171717; --surf-2:#1f1f1f; --surf-3:#262626;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --tx:#ededed; --tx-2:#a3a3a3; --tx-3:#8a8a8a;
  --ok:#3ecf8e; --ok-bg:rgba(62,207,142,.10); --ok-line:rgba(62,207,142,.32);
  --warn:#e0a94a; --warn-bg:rgba(224,169,74,.10); --warn-line:rgba(224,169,74,.32);
  --bad:#f2705f; --bad-bg:rgba(242,112,95,.10); --bad-line:rgba(242,112,95,.34);
  --info:#7ea6f0; --info-bg:rgba(126,166,240,.10); --info-line:rgba(126,166,240,.30);
  --r:16px; --r-2:10px; --r-3:6px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Consolas,monospace;
}
[data-theme="light"]{
  --bg:#fbfbfb; --surf:#ffffff; --surf-2:#f4f4f4; --surf-3:#ebebeb;
  --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.20);
  --tx:#171717; --tx-2:#5b5b5b; --tx-3:#6e6e6e;
  --ok:#0b6b45; --ok-bg:rgba(11,107,69,.08); --ok-line:rgba(11,107,69,.30);
  --warn:#8a5b00; --warn-bg:rgba(138,91,0,.08); --warn-line:rgba(138,91,0,.30);
  --bad:#b3261e; --bad-bg:rgba(179,38,30,.07); --bad-line:rgba(179,38,30,.28);
  --info:#2f56b8; --info-bg:rgba(47,86,184,.07); --info-line:rgba(47,86,184,.26);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--font);
  font-size:13.5px;line-height:1.62;
  /* U1 §2.2 / §6 第5件：等宽数字开在 body 上，而不是逐处加 .num */
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==========================================================================
   1. 原型外壳（演示控件 + 顶栏）
   ========================================================================== */
.chrome{
  position:sticky;top:0;z-index:30;background:var(--surf-2);
  border-bottom:1px dashed var(--line-2);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:7px 18px;font-size:12px;color:var(--tx-2);
}
.chrome .tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  border:1px dashed var(--line-2);border-radius:var(--r-3);padding:1px 6px;color:var(--tx-3);
}
.seg{display:inline-flex;background:var(--surf-3);border:1px solid var(--line);border-radius:var(--r-3);padding:2px;gap:2px}
.seg button{padding:3px 11px;border-radius:4px;font-size:12px;color:var(--tx-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg);font-weight:600}
.seg button:hover:not([aria-pressed="true"]){color:var(--tx)}
.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}

.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:11px 18px;border-bottom:1px solid var(--line);background:var(--bg);
}
.topbar .brand{font-weight:650;font-size:13.5px;letter-spacing:.01em}
.topbar .brand em{font-style:normal;color:var(--tx-3);font-weight:400;margin-left:7px;font-size:12px}
.topbar .spacer{flex:1}
.topbar .meta{font-size:12px;color:var(--tx-3);font-family:var(--mono)}
.ibtn{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-3);font-size:12px;color:var(--tx-2)}
.ibtn:hover{color:var(--tx);border-color:var(--line-2)}

.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 90px}

/* ==========================================================================
   2. 结论区（首屏唯一主角）
   ========================================================================== */
.verdict{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:24px 24px 20px}
.verdict.st-bad{border-color:var(--bad-line);background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg)),var(--surf)}
.verdict.st-cold{border-color:var(--line-2)}
.v-kicker{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:650;letter-spacing:.04em;color:var(--tx-2);text-transform:none}
.v-kicker .mk{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.st-bad .v-kicker{color:var(--bad)} .st-bad .v-kicker .mk{background:var(--bad);animation:beat 1.7s ease-in-out infinite}
.st-cold .v-kicker .mk{background:var(--tx-3)}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.verdict h1{font-size:27px;line-height:1.32;font-weight:680;letter-spacing:-.005em;margin:10px 0 0;text-wrap:pretty;max-width:44ch}
.verdict .v-sub{margin-top:11px;font-size:14px;color:var(--tx-2);max-width:70ch;text-wrap:pretty}
.verdict .v-sub b{color:var(--tx);font-weight:620}
.verdict .v-sub .raw{font-family:var(--mono);font-size:12px;color:var(--tx-3);background:var(--surf-3);padding:1px 5px;border-radius:4px}
.v-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:20px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden}
.v-fact{background:var(--surf);padding:11px 13px}
.v-fact .k{font-size:12px;color:var(--tx-3);letter-spacing:.02em}
.v-fact .v{font-size:22px;font-weight:650;margin-top:3px;line-height:1.25}
.v-fact .v small{font-size:12px;font-weight:500;color:var(--tx-3);margin-left:5px}
.v-fact .n{font-size:12px;color:var(--tx-3);margin-top:1px}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)} .t-x{color:var(--tx-3)}
.v-src{margin-top:12px;font-size:11.5px;color:var(--tx-3);display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono)}

/* ==========================================================================
   3. 问题卡 + 诊断阶梯（本方向的核心母题：现象 → 原因 → 受影响对象 → 原始记录）
   ========================================================================== */
.psec{margin-top:26px}
.psec-hd{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.psec-hd h2{font-size:13.5px;font-weight:650;letter-spacing:.02em}
.psec-hd .cnt{font-size:12px;color:var(--tx-3)}
.quiet{display:flex;align-items:flex-start;gap:10px;padding:15px 2px;font-size:14px;color:var(--tx-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quiet .mk{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;margin-top:7px}
.quiet b{color:var(--tx);font-weight:600}
.quiet .sub{color:var(--tx-3);font-size:12.5px;margin-top:2px}

.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-bottom:12px;overflow:hidden}
.pcard.sev-need{border-color:var(--bad-line)}
.pcard.sev-watch{border-color:var(--warn-line)}
.pcard-hd{display:flex;gap:11px;align-items:flex-start;padding:15px 18px 13px}
.pcard-hd .sev{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:4px;margin-top:2px}
.sev-need .sev{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.sev-watch .sev{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.sev-done .sev{background:var(--surf-3);color:var(--tx-3);border:1px solid var(--line)}
.pcard-hd .ttl{font-size:15px;font-weight:640;line-height:1.45;text-wrap:pretty}
.pcard-hd .sub{font-size:13px;color:var(--tx-2);margin-top:5px;text-wrap:pretty}
.pcard-hd .sub code{font-family:var(--mono);font-size:11.5px;color:var(--tx-3)}
.pcard-bd{border-top:1px solid var(--line);padding:4px 18px 15px}

.ladder{position:relative}
.stage{position:relative;padding-left:30px}
.stage::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.stage:last-child::before{bottom:auto;height:22px}
.stage-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0 11px 0;border-bottom:1px solid transparent}
.stage-hd .st-i{
  position:absolute;left:0;top:9px;width:17px;height:17px;border-radius:50%;
  background:var(--surf-3);border:1px solid var(--line-2);color:var(--tx-2);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.stage[data-open="1"] .stage-hd .st-i{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.stage-hd .st-name{font-size:12.5px;font-weight:650;color:var(--tx);flex:none;letter-spacing:.02em}
.stage-hd .st-sum{font-size:12.5px;color:var(--tx-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-hd .st-chev{color:var(--tx-3);font-size:10px;flex:none}
.stage-bd{display:none;padding:2px 0 15px}
.stage[data-open="1"] .stage-bd{display:block}
.stage-bd p{font-size:14px;color:var(--tx-2);margin-bottom:9px;text-wrap:pretty}
.stage-bd p b{color:var(--tx);font-weight:620}
.stage-bd p code{font-family:var(--mono);font-size:12px;background:var(--surf-3);padding:1px 5px;border-radius:4px;color:var(--tx-2)}

/* 10 分钟刻度条：一次故障里每一次出口尝试 */
.ticks{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 10px}
.ticks i{width:9px;height:15px;border-radius:2px;display:block}
.ticks i.f{background:var(--bad)} .ticks i.s{background:var(--ok)}
.ticks i.u{background:var(--surf-3)}
.ticklegend{font-size:12px;color:var(--tx-3);display:flex;gap:14px;margin-bottom:10px}
.ticklegend span{display:flex;align-items:center;gap:5px}

/* 判据自检 */
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.judge div{border:1px solid var(--line);border-radius:var(--r-2);padding:9px 11px;background:var(--surf-2)}
.judge .jk{font-size:12px;color:var(--tx-3)}
.judge .jv{font-size:13px;font-weight:600;margin-top:2px}
.judge .jd{font-size:11.5px;color:var(--tx-3);margin-top:3px}

/* 受影响对象 */
.aff{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:10px}
.aff>div{border:1px solid var(--line);border-radius:var(--r-2);padding:11px 12px;background:var(--surf-2)}
.aff .ak{font-size:12px;color:var(--tx-3);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip2{
  font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:999px;
  border:1px solid var(--bad-line);background:var(--bad-bg);color:var(--bad);
}
.chip2.n{border-color:var(--line);background:var(--surf-3);color:var(--tx-3)}
.chip2.act{border-color:var(--info-line);background:var(--info-bg);color:var(--info)}
button.chip2{cursor:pointer}
button.chip2:hover{border-color:var(--tx-3);color:var(--tx)}
.subtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.subtbl td{padding:4px 0;border-bottom:1px solid var(--line);color:var(--tx-2)}
.subtbl tr:last-child td{border-bottom:none}
.subtbl td.r{text-align:right;font-family:var(--mono)}

/* 动作行 */
.acts{display:flex;gap:7px;flex-wrap:wrap;padding-top:4px}
.btn{padding:5px 11px;border:1px solid var(--line-2);border-radius:var(--r-3);font-size:12.5px;color:var(--tx)}
.btn:hover{border-color:var(--tx-3);background:var(--surf-2)}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.btn.pri:hover{opacity:.88}

/* 已自动处理 */
.donelist{display:flex;flex-direction:column}
.doneitem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--tx-2)}
.doneitem:last-child{border-bottom:none}
.doneitem .t{font-family:var(--mono);font-size:11.5px;color:var(--tx-3);flex:none;width:44px}
.doneitem b{color:var(--tx);font-weight:600}

/* ==========================================================================
   4. 折叠卡 / 节点健康表 / 调用记录
   ========================================================================== */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);margin-top:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-hd.fold{cursor:pointer;border-bottom-color:transparent}
.card-hd .ttl{font-size:13.5px;font-weight:640}
.card-hd .hint{font-size:12px;color:var(--tx-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-hd .chev{color:var(--tx-3);font-size:10px}
.card.folded .card-hd{border-bottom-color:transparent}
.card.folded .card-bd{display:none}
.card-bd{padding:13px 16px 16px}
.chipsbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cb{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--tx-2)}
.cb[aria-pressed="true"]{border-color:var(--tx-3);color:var(--tx);background:var(--surf-2)}

/* 表格 */
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:830px}
table.tbl th{
  text-align:left;font-size:12px;font-weight:600;color:var(--tx-3);letter-spacing:.02em;
  padding:7px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:relative
}
table.tbl th.num{text-align:right}
table.tbl th.srt{cursor:pointer;user-select:none}
table.tbl th.srt:hover{color:var(--tx)}
table.tbl th .ar{color:var(--tx);margin-left:4px;font-size:9px}
table.tbl th .ar.off{color:var(--tx-3);opacity:.45}
table.tbl td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl td.num{text-align:right;font-family:var(--mono);font-size:12.5px}
table.tbl tbody tr.row{cursor:pointer}
table.tbl tbody tr.row:hover{background:var(--surf-2)}
table.tbl tbody tr.row.open{background:var(--surf-2)}
tr.grp td{background:var(--surf-2);font-size:12px;color:var(--tx-2);font-weight:600;letter-spacing:.02em;padding:6px 9px;border-bottom:1px solid var(--line)}
tr.grp td .g-note{font-weight:400;color:var(--tx-3);margin-left:7px;font-family:var(--mono);font-size:11.5px}
tr.more td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr.sub td{background:var(--surf-2);padding:0 9px 12px;border-bottom:1px solid var(--line)}
tr.sub .in{border:1px solid var(--line);border-radius:var(--r-2);padding:12px 13px;background:var(--surf)}
tr.sub .in .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
tr.sub h4{font-size:12px;color:var(--tx-3);font-weight:600;letter-spacing:.03em;margin:11px 0 6px}
tr.sub h4:first-child{margin-top:0}

.nm{display:flex;align-items:center;gap:7px;min-width:0}
.nm .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.available{background:var(--ok)} .dot.exhausted{background:var(--warn)} .dot.dead{background:var(--bad)} .dot.idle{background:var(--tx-3)}
.nm .txt{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .cur{font-size:10px;color:var(--info);border:1px solid var(--info-line);background:var(--info-bg);border-radius:3px;padding:0 4px;flex:none}

.axis{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%}
.axis .bar{width:42px;height:6px;border-radius:99px;background:var(--surf-3);overflow:hidden;flex:none;border:1px solid var(--line)}
.axis .bar i{display:block;height:100%}
.axis .bar.nod{border-style:dashed;border-color:var(--line-2);background:transparent}
.axis .val{font-family:var(--mono);font-size:12.5px;min-width:2.2em;text-align:right}
.nodata{font-size:12px;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:4px;padding:1px 6px;display:inline-block}
.sb{font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:4px;flex:none;letter-spacing:.02em}
.sb.good{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.sb.mid{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.sb.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.n-smp{color:var(--tx-3);font-size:11.5px}
.srcnote{font-size:11.5px;color:var(--tx-3);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.srcnote b{color:var(--tx-2);font-weight:600}

/* 组件明细 */
.comps{display:flex;flex-direction:column;gap:6px}
.comp{display:grid;grid-template-columns:64px 1fr 58px;align-items:center;gap:8px;font-size:12px;color:var(--tx-2)}
.comp .cbar{height:7px;border-radius:99px;background:var(--surf-3);overflow:hidden;border:1px solid var(--line)}
.comp .cbar i{display:block;height:100%}
.comp .cval{font-family:var(--mono);text-align:right}
.rchn{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.rch{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.rch.gray{border-color:var(--line);background:var(--surf-3);color:var(--tx-3)}
.tl{display:flex;flex-direction:column;gap:5px;font-size:12px}
.tlrow{display:grid;grid-template-columns:52px 1fr;gap:9px;color:var(--tx-2)}
.tlrow .tt{font-family:var(--mono);color:var(--tx-3)}
.tlrow code{font-family:var(--mono);font-size:11.5px;color:var(--tx-3)}

/* 调用记录 */
.rec{border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec-hd{display:flex;gap:10px;align-items:center;padding:9px 2px;cursor:pointer}
.rec-hd:hover{background:var(--surf-2)}
.rec-hd .when{font-family:var(--mono);font-size:12px;color:var(--tx-3);flex:none;width:42px}
.rec-hd .why{flex:1;min-width:0;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-hd .why .raw{font-family:var(--mono);font-size:11.5px;color:var(--tx-3);margin-left:6px}
.rec-hd .mdl{font-family:var(--mono);font-size:11.5px;color:var(--tx-3);flex:none}
.rec-hd .dur{font-family:var(--mono);font-size:11.5px;color:var(--tx-2);flex:none;width:56px;text-align:right}
.rs{font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:4px;flex:none}
.rs.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.rs.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.rec-bd{display:none;padding:4px 2px 13px}
.rec.open .rec-bd{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px;color:var(--tx-2);margin-bottom:9px}
.kv .k{color:var(--tx-3)}
.kv .v{font-family:var(--mono);word-break:break-all}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-2);padding:18px;text-align:center;color:var(--tx-3);font-size:13px}
.empty .e-t{color:var(--tx-2);font-weight:600;margin-bottom:4px}
.empty .acts{justify-content:center;margin-top:11px}

/* 24h 走势 */
.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin:4px 0 6px}
.spark div{flex:1;background:var(--surf-3);border-radius:2px 2px 0 0;min-height:3px}
.spark div.hi{background:var(--info)}
.ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);font-family:var(--mono)}

/* 失败构成 */
.fbar{display:flex;height:10px;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin:4px 0 11px}
.fbar i{display:block;height:100%}
.fleg{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 20px}
.fleg div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx-2)}
.fleg .sw{width:9px;height:9px;border-radius:2px;flex:none}
.fleg .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--tx-3)}

/* 设计说明 */
.notes{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
.notes>summary{padding:12px 16px;cursor:pointer;font-size:12.5px;font-weight:640;color:var(--tx-2);list-style:none}
.notes>summary::-webkit-details-marker{display:none}
.notes>summary::before{content:'▸ ';color:var(--tx-3)}
.notes[open]>summary::before{content:'▾ '}
.notes-bd{padding:2px 18px 20px;border-top:1px solid var(--line);font-size:13.2px;color:var(--tx-2);line-height:1.75}
.notes-bd h3{font-size:12px;color:var(--tx);font-weight:650;margin:16px 0 6px;letter-spacing:.02em}
.notes-bd h3:first-child{margin-top:14px}
.notes-bd ul{padding-left:19px}
.notes-bd li{margin:3px 0;text-wrap:pretty}
.notes-bd code{font-family:var(--mono);font-size:11.5px;background:var(--surf-3);padding:1px 5px;border-radius:4px;color:var(--tx-2)}
.notes-bd b{color:var(--tx);font-weight:620}
.notes-bd .warn{color:var(--warn)}
.notes-bd .bad{color:var(--bad)}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--surf-3);border:1px solid var(--line-2);color:var(--tx);
  padding:8px 14px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60;max-width:80vw
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  .v-facts{grid-template-columns:1fr 1fr}
  .aff,.judge{grid-template-columns:1fr}

  .verdict h1{font-size:21px}
  .wrap{padding:18px 12px 70px}
  .stage-hd .st-sum{display:none}
}

/* —— 节点池：227 个（115 available / 2 exhausted / 110 dead），与 ROADMAP C-5 事故同量级 */
var POOL=(function(){
  var stars=[
    ['主订阅::HK-01','vless','available',48],
    ['主订阅::HK-03','vless','available',41],
    ['主订阅::JP-02','vmess','available',86],

      if(src==='手配'){nm='自建-'+reg[gen%reg.length]+'-'+String(gen).padStart(2,'0');}
      else{nm=src+'::'+reg[gen%reg.length]+'-'+String(gen).padStart(3,'0');}

  function mk(name,proto,st,lat,rnd,tag){
    var idx=name.indexOf('::');

/* ============================================================================
   C. 事件类型 → 人话（CL_ISSUE_TYPES 是 Go 测试钉住的前端常量，一字不改）
   专业术语不藏死：每句人话旁边都留了原始 type 的一键展开位
   ========================================================================== */
var CL_ISSUE_TYPES=['switch','ttft_timeout','silence_timeout','stream_interrupt','stream_error','connect_error','upstream_error','all_failed'];
var HUMAN={
  connect_error:'连不上这个出口 IP',
  upstream_error:'上游拒绝了这次请求',
  all_failed:'所有节点都没成，最后走了直连',
  switch:'中途换了一个节点',
  ttft_timeout:'等了太久没等到第一个字',
  silence_timeout:'生成中途卡住不动了',
  stream_interrupt:'连接被上游掐断',
  stream_error:'流式响应出错',
  quota_halt:'被网关闸门挡住了（当时没有可用出口）',
  connect_ok:'连上了出口'
};
function humanWhy(r){
  if(r.status!=='fail'&&!hasIssue(r))return '正常完成';
  var evs=r.events||[], i;
  if(r.status==='ok'){for(i=0;i<evs.length;i++)if(evs[i].type==='all_failed')return '所有节点都没成，最后走了直连';}
  /* 判定顺序与 admin.html:2110 的 clRenderNode 一致：闸门 > 连接 > 其它 */
  for(i=0;i<evs.length;i++)if(evs[i].type==='quota_halt'&&String(evs[i].detail||'').indexOf('blocked')>=0)return HUMAN.quota_halt;
  for(i=0;i<evs.length;i++)if(evs[i].type==='upstream_error'){
    var d=String(evs[i].detail||'');
    if(d.indexOf('403')>=0)return '出口 IP 被上游拒绝（403）';
    if(d.indexOf('429')>=0)return '上游说请求太频繁（429）';
    if(/5\d\d/.test(d))return '上游自己出错了（'+d.match(/5\d\d/)[0]+'）';
    return '上游返回了错误';
  }
  for(i=0;i<evs.length;i++)if(evs[i].type==='connect_error')return '连不上这个出口 IP';
  for(i=0;i<evs.length;i++)if(evs[i].type==='ttft_timeout')return '等了太久才等到第一个字';
  for(i=0;i<evs.length;i++)if(evs[i].type==='silence_timeout')return '生成中途卡住不动了';
  for(i=0;i<evs.length;i++)if(evs[i].type==='stream_interrupt')return '连接被上游掐断';
  for(i=0;i<evs.length;i++)if(evs[i].type==='all_failed')return '所有节点都没成，改走了直连';
  return r.err_msg||'异常结束';
}
function hasIssue(r){if(r.status!=='ok')return true;
  return (r.events||[]).some(function(e){return CL_ISSUE_TYPES.indexOf(e.type)>=0;});}
function rawTypes(r){return (r.events||[]).map(function(e){return e.type;}).join(' · ')||'—';}

/* ============================================================================
   D. 时间窗与评分：同一套函数供表与下钻共用，保证"两处数字永远相等"
   ========================================================================== */
function winStats(n,win){
  /* 冷启动 = 这个安装从来没有过节点出口流量 ⇒ 两个窗口都没有样本。
     所以这里必须整体返回 0 样本，而不是"24h 有样本、10m 没有"。 */
  if(state==='cold')return {samples:0, ok:0, rate:null};
  if(win==='10m'){
    var a=(state==='calm')?(n._c?n._c.attempts:0):(state==='fault'?n.w10.attempts:0);
    var ok=(state==='calm')?(n._c?n._c.successes:0):0;
    return {samples:a, ok:ok, rate:a>0?ok/a:null};
  }
  return {samples:n.samples24, ok:Math.round(n.samples24*n.s24), rate:n.samples24>0?n.s24:null};
}
function scoreOf(n,win){
  var w=winStats(n,win);
  if(!(w.samples>0))return {value:null,samples:0,components:[],stable:n.stab};
  return {value:0.6*w.rate+0.4*n.stab, samples:w.samples,
    components:[{key:'success_rate',label:'成功率',value:w.rate,weight:0.6},
                {key:'stability',label:'稳定性',value:n.stab,weight:0.4}],
    reasons:reasonsOf(n,w)};
}
function reasonsOf(n,w){
  var rs=[];
  if(n.cooldown_until)rs.push('cooldown');
  if(w.rate!=null&&w.rate<0.6)rs.push('recent_errors');
  if(w.samples<20)rs.push('low_samples');
  if(n.state==='dead')rs.push('transport_fail');
  return rs;
}
var REASON_CN={cooldown:'处于冷却（配额耗尽）',recent_errors:'近期失败偏多',low_samples:'样本太少，分不可信',transport_fail:'连接层不通'};
function tier(v){if(v==null)return null;if(v>=80)return {k:'good',t:'优'};if(v>=60)return {k:'mid',t:'一般'};return {k:'bad',t:'差'};}
function issuesOf(n,w){
  /* 异常/切换 = 该窗口内落到这个出口上的异常事件数（近似 = 失败尝试数 + 切换次数）。
     真实实现直接从 call-log 的 events[] 计数，这里用同口径的派生值。 */
  if(!(w.samples>0))return 0;
  return Math.round(w.samples*(1-(w.rate||0)));
}
function axisCell(v,samples,extra){
  if(!(samples>0)||v==null)return '<span class="axis"><span class="bar nod" title="无样本"></span><span class="nodata">无数据</span></span>';
  var t=tier(v), col=t.k==='good'?'var(--ok)':(t.k==='mid'?'var(--warn)':'var(--bad)');
  return '<span class="axis"><span class="bar"><i style="width:'+Math.max(3,v)+'%;background:'+col+'"></i></span>'+
    '<span class="val">'+Math.round(v)+'</span>'+
    '<span class="sb '+t.k+'">'+t.t+'</span>'+(extra||'')+'</span>';
}

function recListHTML(onlyIds,inCard){
  var rs=RECORDS.filter(function(r){
    if(onlyIds)return onlyIds.indexOf(r.req_id)>=0;
    if(focusNode&&(r.node_names||[]).indexOf(focusNode)<0)return false;
    if(recFilter==='fail'&&r.status==='ok')return false;
    if(recFilter==='issue'&&!hasIssue(r))return false;
    return true;
  });
  if(!rs.length){
    return '<div class="empty"><div class="e-t">没有匹配的调用记录</div>'+
      '<div>当前筛选下没有记录。放宽筛选，或等一次新请求进来。</div>'+
      '<div class="acts"><button class="btn" data-act="recfilter" data-v="all">显示全部记录</button></div></div>';
  }
  return rs.map(function(r){
    var open=!!recOpen[r.req_id];
    var chain=(r.node_names||[]).join(' → ')||'（未经过节点 · 直连出口）';
    var where=(function(){
      var i=r.nodes?r.nodes.length-1:-1;
      if(i<0){var evs=r.events||[];
        if(evs.some(function(e){return e.type==='quota_halt'&&String(e.detail||'').indexOf('blocked')>=0;}))return '直连·闸门拒绝';
        if(evs.some(function(e){return e.type==='connect_error';}))return '直连·连不上';
        return '直连·其他';}
      return (r.node_names&&r.node_names[i])||r.nodes[i];
    })();
    return '<div class="rec'+(open?' open':'')+'">'+
      '<div class="rec-hd" data-act="rec" data-k="'+esc(r.req_id)+'">'+
        '<span class="when">'+hhmm(r.ts)+'</span>'+
        '<span class="rs '+(r.status==='ok'?'ok':'fail')+'">'+(r.status==='ok'?'成功':'失败')+'</span>'+
        '<span class="why">'+esc(humanWhy(r))+'<span class="raw">'+esc(rawTypes(r))+'</span></span>'+
        '<span class="mdl">'+esc(r.model||'-')+'</span>'+
        '<span class="dur">'+dur(r.duration_ms)+'</span>'+
      '</div>'+
      '<div class="rec-bd">'+
        '<div class="kv">'+
          '<span class="k">req_id</span><span class="v">'+esc(r.req_id)+'</span>'+
          '<span class="k">ts</span><span class="v">'+esc(r.ts)+'</span>'+
          '<span class="k">path</span><span class="v">'+esc(r.path||'-')+'</span>'+
          '<span class="k">route_mode</span><span class="v">'+esc(r.route_mode||'-')+' · stream '+(r.stream?'是':'否')+'</span>'+
          '<span class="k">nodes[]</span><span class="v">'+esc((r.nodes||[]).join(' → ')||'（空）')+'</span>'+
          '<span class="k">最终出口</span><span class="v">'+esc(where)+'</span>'+
          '<span class="k">tokens</span><span class="v">输入 '+(r.prompt_tokens||0)+' / 输出 '+(r.completion_tokens||0)+' · ttft '+dur(r.ttft_ms)+'</span>'+
          (r.err_msg?'<span class="k">err_msg</span><span class="v" style="color:var(--bad)">'+esc(r.err_msg)+'</span>':'')+
        '</div>'+
        '<div class="tl">'+(r.events||[]).map(function(e){
          return '<div class="tlrow"><span class="tt">'+hhmmss(e.at)+'</span><span>'+
            '<b style="color:var(--tx)">'+esc(HUMAN[e.type]||e.type)+'</b> '+
            (e.node_name?'<span class="chip2 act">'+esc(e.node_name)+'</span> ':'')+
            (e.detail?'<span style="color:var(--tx-3)">'+esc(e.detail)+'</span> ':'')+
            '<code>'+esc(e.type)+'</code></span></div>';
        }).join('')+'</div>'+
        (where.indexOf('直连')<0&&r.status==='ok'&&(r.events||[]).some(function(e){return e.type==='all_failed';})
          ? '<p style="font-size:11.5px;color:var(--warn);margin-top:9px">口径提醒：这条请求最后是靠直连成功的，但 <code>nodes[]</code> 里没有「直连」这一跳，'+
            '所以按最终出口归因时会算到最后一个节点头上。这是当前 call-log 的已知缺口。</p>' : '')+
      '</div></div>';
  }).join('');
}

function cardHead(k,ttl,hint,folded){

function cardNodes(folded){
  var measured=NODES.filter(function(n){return winStats(n,WIN).samples>0;});
  var unmeasured=NODES.filter(function(n){return !(winStats(n,WIN).samples>0);});
  var hint=folded

    : '共 '+NODES.length+' 个 · 评分基于'+ (WIN==='24h'?'最近 24 小时':'最近 10 分钟') +'的真实出口记录';
  var sortable=['score','rate','req','issue','lat'];
  function th(k,label,cls){
    var on=(sort.key===k&&!sort.def), ar='';
    if(on)ar='<span class="ar">'+(sort.dir==='asc'?'▲':'▼')+'</span>';
    else ar='<span class="ar off">'+(k==='score'?'▼':'⇅')+'</span>';
    return '<th class="'+(cls||'')+' srt" data-act="sort" data-k="'+k+'" aria-sort="'+(on?(sort.dir==='asc'?'ascending':'descending'):'none')+'">'+
      label+(k==='score'?'<span title="评分字段来自 U1 §8.4 的接口契约建议；/api/nodes 目前还没有 score 字段 —— 原型里用它把列位和空态占住。">∘</span>':'')+ar+'</th>';
  }
  var head='<thead><tr>'+
    '<th>名称</th>'+th('score','评分','num')+th('rate','成功率 (样本)','num')+th('req','请求数','num')+
    th('issue','异常/切换','num')+th('lat','延迟','num')+'<th class="num">冷却至</th><th></th>'+
  '</tr></thead>';
  var rows='';
  /* 分组：已测量（按当前排序）→ 未测量（恒定置末，按名称），见 U1 §8.2⑤ */
  measured.sort(function(a,b){
    var av,bv;
    function val(n,k){
      var w=winStats(n,WIN), sc=scoreOf(n,WIN);
      if(k==='score')return sc.value==null?-1:sc.value*100;
      if(k==='rate')return w.rate==null?-1:w.rate;
      if(k==='req')return w.samples;
      if(k==='issue')return issuesOf(n,w);
      if(k==='lat')return n.latency_ms==null?-1:n.latency_ms;
      return 0;
    }
    av=val(a,sort.key);bv=val(b,sort.key);
    if(av===bv)return a.name<b.name?-1:1;
    return sort.dir==='asc'?(av-bv):(bv-av);
  });

  }
  rows+='<tr class="grp"><td colspan="8">未测量（该窗口内没有样本）<span class="g-note">'+unmeasured.length+' 个 · 恒定排在最后，不参与评分排序</span></td></tr>';

    rows+='<tr><td colspan="8" style="color:var(--tx-3);font-size:12px">全部节点都有样本。</td></tr>';
  }else{
    var capU=(showAll.u||focusNode)?unmeasured.length:Math.min(8,unmeasured.length);

    if(unmeasured.length>8)rows+='<tr class="more"><td colspan="8"><button class="cb" data-act="more" data-k="u">'+
      ((showAll.u||focusNode)?('收起，只看前 8 个'):('展开其余 '+(unmeasured.length-capU)+' 个未测量节点'))+'</button></td></tr>';
  }

      '<span style="flex:1"></span>'+

      '<span><b>名称 / 状态 / 延迟 / 冷却至</b> ← <code>/api/nodes</code>（快照 '+hhmmss(BASE)+'）</span>'+
      '<span><b>成功率 / 请求数 / 评分</b> ← 调用日志按最终出口聚合（'+ (WIN==='24h'?'24h':'10m') +'，'+hhmmss(BASE)+'）</span>'+
      '<span><b>评分</b> ← U1 §8.4 建议字段（后端尚未提供）</span>'+
      '<span><b>订阅归属</b> ← 节点名前缀「订阅名::」推断，非新增字段</span>'+
    '</div>';
  return '<div class="card'+(folded?' folded':'')+'" data-card="nodes">'+cardHead('nodes','节点健康（'+NODES.length+'）',hint,folded)+

  '</div>';

function render(){
  document.getElementById('verdict').innerHTML=verdictHTML();
  document.getElementById('problems').innerHTML=problemCardsHTML();
  document.getElementById('cards').innerHTML=cardsHTML();
  document.getElementById('lastRefresh').textContent='最后刷新 '+hhmmss(BASE)+' · 演示数据';
  var segs=document.querySelectorAll('[data-act="state"]');
  for(var i=0;i<segs.length;i++)segs[i].setAttribute('aria-pressed',String(segs[i].getAttribute('data-v')===state));
  /* 自检：口径加总必须闭合（U1 §6 第1件验收第 2 条） */
  var s=0,f=0,j;
  for(j=0;j<D24.exits.length;j++)s+=D24.exits[j].req;
  for(j=0;j<D24.fails.length;j++)f+=D24.fails[j].n;
  if(s!==D24.total||f!==D24.fail){
    console.warn('[mockup] 口径不闭合：出口形态合计='+s+'/'+D24.total+'，失败构成合计='+f+'/'+D24.fail);
  }
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act'), k=el.getAttribute('data-k'), v=el.getAttribute('data-v');
  if(act==='state'){
    state=v;WIN=(state==='fault'?'10m':'24h');expanded={};stagesOpen={};recOpen={};focusNode=null;
    showAll={m:false,u:false};
    fold={nodes:null,exits:(state!=='fault'),trend:true};
    if(state==='fault'){stagesOpen.A1=true;stagesOpen.A2=true;stagesOpen.A3=true;}
    render();
  }else if(act==='win'){WIN=v;expanded={};showAll={m:false,u:false};render();}
  else if(act==='more'){showAll[k]=!showAll[k];render();}
  else if(act==='sort'){
    if(sort.def||sort.key!==k){sort={key:k,dir:'asc',def:false};}
    else if(sort.dir==='asc'){sort={key:k,dir:'desc',def:false};}
    else{sort={key:'score',dir:'desc',def:true};}
    render();
  }else if(act==='row'){var fp=el.getAttribute('data-fp');expanded[fp]=!expanded[fp];render();}
  else if(act==='stage'){stagesOpen[k]=!stagesOpen[k];render();}
  else if(act==='card'){
    var cur=(k==='nodes')?((fold.nodes===null)?(state==='calm'):fold.nodes):!!fold[k];
    fold[k]=!cur;render();
  }
  else if(act==='rec'){recOpen[k]=!recOpen[k];render();}
  else if(act==='recfilter'){recFilter=v;focusNode=null;render();}
  else if(act==='focus'){
    focusNode=v||null;
    for(var key in expanded)delete expanded[key];
    if(v){for(var i=0;i<NODES.length;i++)if(NODES[i].name===v){expanded[NODES[i].fingerprint]=true;WIN='24h';}}
    render();
    var t=document.querySelector('[data-card="nodes"]');
    if(t&&t.scrollIntoView)t.scrollIntoView({block:'start'});
  }else if(act==='records'){focusNode=el.getAttribute('data-n')||null;render();}
  else if(act==='theme'){
    var cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  }else if(act==='toast'){toast(el.getAttribute('data-msg')||'');}
});
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('on');},2600);
}

'所以要让结论区那句「24 小时成功率 88.5%」是真的，后端得在窗口聚合里补 <code>ok/fail</code>（或 <code>status_counts</code>）。这是本方向对后端的最小诉求。</li>',
'<li class="bad"><b>口径缺口 2：直连兜底的成功会被记在最后一个节点头上。</b><code>clRenderNode</code> 按 <code>nodes[last]</code> 归因，但请求改走直连时 <code>nodes[]</code> 里没有「直连」这一跳。',
'原型的调用记录展开区把这条写出来了。要修得在 call-log 里给「最终出口是否直连」一个标记。</li>',
'</ul>',

'<h3>刻意放弃 / 妥协了什么</h3>',
'<ul>',
'<li><b>放弃了「总览式仪表盘」。</b>热力图、甜甜圈、模型分布、请求量表这些现面板里的图，在本方向里没有位置。理由（U1 §8.3）：评分与健康是<b>排序工具</b>不是分析工具，',
'运维的动作是「把差的切掉 / 看它为什么差」，雷达图与散点图回答不了「下一个该切谁」。代价是：想「欣赏分布」的用户得回到 A 方向那种面板。</li>',
'<li><b>放弃了主导航。</b>没有了 5 个分区的侧栏，只有「结论 → 问题 → 折叠明细」。代价：配置类操作（改 api_key、模型映射、SOCKS5）在这个结构里没有自然落点 ——',
'真实落地时它们应该收进一个「设置」抽屉，而不是塞进诊断流。本原型没画那块。</li>',
'<li><b>放弃了 hover 承载信息。</b>所有解释都做成行内可展开（U1 §7.6 的触屏问题），<code>title</code> 只用来放补充说明。代价是页面比纯 tooltip 方案更"长"。</li>',
'<li><b>妥协：圆角 16px，不是 freellm 的 24px。</b>诊断流信息密度更高，24px 会显得轻浮；这是对 U1 §2.4 的有意偏离。</li>',
'<li><b>妥协：只做深色主题的完整打磨，浅色主题只保证令牌同构可切换、未逐屏调对比。</b>任务要求「深色主题优先」。</li>',
'<li><b>妥协：字号没有照抄 freellm 的 12px 正文。</b>U1 §2.2 实测它的正文几乎只用 12/14px 两档，但可读性硬底线是「正文 ≥14px、标签/注释 ≥12px」。',
'这里正文统一 14px、标签 ≥12px、表格 13px（227 行的密度需求）。属于对 U1 结论的有意上调。</li>',
'<li><b>妥协：节点表默认只显示前 20 个已评分 + 前 8 个未测量，其余一键展开。</b>227 行一次铺开会把「平时极简」毁掉；',
'真实实现可以分页或虚拟滚动，原型用「展开其余 N 个」表达同一件事。</li>',
'<li><b>妥协：完全没画配置/写操作。</b>原型里所有按钮都只弹一条 toast（写操作在真实面板是 <code>POST /api/nodes</code> 的 switch/reset/probe/reload/save）。',
'危险操作二次确认（U1 §6 第5件的 ConfirmButton 三行状态机）没有实现 —— 它不是本方向的差异点，留到落地阶段统一处理。</li>',
'<li><b>未覆盖：C-5 判据 B（available = 0）。</b>故障态演示的是判据 A（成功率 0%）。判据 B 的形态在同一张卡里，只需把 <code>node_alert.reason</code> 换成「节点池无可用节点」并把 <code>pool_available</code> 打到 0 —— 阶梯结构不变。</li>',
'</ul>',

'<h3>落地代价（给 U3 的提示）</h3>',
'<ul>',
'<li>这份原型是<b>单文件、无框架、无构建</b>，可以直接把它当模板重写成 <code>static/admin.html</code> 的替代品；本文件与 <code>admin.html</code> 共享同一套约束（无外网字体、无 CDN、可 <code>go:embed</code>）。</li>',
'<li>渲染只需现有三个接口：<code>/api/nodes</code>（节点状态 + <code>node_alert</code>）、<code>/api/call-log?limit=500</code>（聚合出成功率/样本量/评分）、<code>/api/stats?range=</code>（用量）。<b>不需要新接口就能做出 90% 的效果</b>，只有上面两条「口径缺口」需要后端配合。</li>',
'<li class="bad">红线：<code>discev_test.go:29-35</code> 会从 <code>static/admin.html</code> 里正则抽 <code>CL_ISSUE_TYPES</code> 常量。落地时这行常量必须原样保留（本原型里它逐字保留在 <code>&lt;script&gt;</code> 顶部）。</li>',
'<li>本原型对 <code>event.type</code> → 人话的映射表（<code>HUMAN</code> / <code>humanWhy</code>）建议直接搬，它就是「文案说人话」这一条要求的全部实现。</li>',
