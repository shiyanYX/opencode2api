services:
  opencode2api:
    image: ${OPENCODE2API_IMAGE:-ghcr.io/6kmfi6hp/opencode2api:latest}
    container_name: opencode2api
    restart: unless-stopped
    ports:
      - "${OPENCODE2API_HTTP_PORT:-8000}:8000"
    environment:
      OPENCODE2API_PORT: "8000"
      OPENCODE2API_PASSWORD: ${OPENCODE2API_PASSWORD:-change-me}
      OPENCODE2API_WEBSHARE_API_KEY: ${OPENCODE2API_WEBSHARE_API_KEY:-}
      OPENCODE2API_WEBSHARE_NAME: ${OPENCODE2API_WEBSHARE_NAME:-webshare}
      OPENCODE2API_WEBSHARE_MODE: ${OPENCODE2API_WEBSHARE_MODE:-direct}
      OPENCODE2API_WEBSHARE_INTERVAL: ${OPENCODE2API_WEBSHARE_INTERVAL:-24}
    volumes:
      - opencode2api-data:/data

volumes:
  opencode2api-data:
